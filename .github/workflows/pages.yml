name: Validate and deploy demo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: web
      - run: node --test typescript/demo.test.ts
      - run: PYTHONPATH=python python -m unittest discover -s python/tests -v
      - run: python -m unittest discover -s sql -p 'test_*.py' -v
      - run: npm run build
        working-directory: web
      - run: pip install -r web/requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - name: Browser smoke test
        run: |
          python -m http.server 4173 --directory web/dist --bind 127.0.0.1 &
          demo_server_pid=$!
          trap 'kill "$demo_server_pid"' EXIT
          python web/test_browser.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
