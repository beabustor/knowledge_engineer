name: Validate and deploy demo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 04-app/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: 04-app
      - run: npm test
        working-directory: 04-app
      - run: PYTHONPATH=06-examples/python python -m unittest discover -s 06-examples/python/tests -v
      - run: python -m unittest discover -s 06-examples/sql -p 'test_*.py' -v
      - run: PYTHONPATH=07-deployment python -m unittest discover -s 07-deployment/optional/tests -v
      - run: npm run build
        working-directory: 04-app
      - run: pip install -r 04-app/requirements-test.txt
      - run: python -m unittest discover -s 02-model -p 'test_*.py' -v
      - run: python 05-validation/01-semantic/validate.py
      - run: python 05-validation/04-impact/verify.py
      - run: python 05-validation/05-structure/verify.py
      - run: node 05-validation/02-extraction/run.ts
      - run: python -m playwright install --with-deps chromium
      - run: python 05-validation/04-impact/test_browser.py
      - name: Browser smoke test
        run: python 04-app/test_browser.py
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: 04-app/test-results/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 04-app/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
