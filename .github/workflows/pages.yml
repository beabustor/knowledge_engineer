name: Validate and deploy demo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: web
      - run: node --test typescript/demo.test.ts explorer/model.test.ts web/import-catalog.test.ts
      - run: PYTHONPATH=python python -m unittest discover -s python/tests -v
      - run: python -m unittest discover -s sql -p 'test_*.py' -v
      - run: python -m unittest discover -s optional/tests -v
      - run: npm run build
        working-directory: web
      - run: pip install -r web/requirements-test.txt
      - run: python -m unittest discover -s explorer -p 'test_*.py' -v
      - run: python -m playwright install --with-deps chromium
      - name: Browser smoke test
        run: python web/test_browser.py
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: web/test-results/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
