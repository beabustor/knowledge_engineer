<!doctype html><html lang="__LANG__"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SQL · Query to evidence</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f2;color:#173d35;font:16px/1.6 system-ui,sans-serif}main{max-width:1250px;margin:auto;padding:28px}h1{font-size:32px;line-height:1.2}header small{font-weight:700;letter-spacing:1px}select{width:100%;padding:12px;font:inherit;border:1px solid #afcaba;border-radius:8px;background:white;color:inherit}.note{padding:12px 16px;border-left:4px solid #c29b47;background:#faf3df}.pipeline{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.pipeline span{background:#e3ede6;border:1px solid #b9d0c0;border-radius:9px;padding:9px 14px}article{background:white;border:1px solid #d5e2d8;border-radius:14px;padding:24px;margin-top:22px}h2{margin-top:0}.columns{display:grid;grid-template-columns:1.1fr 1fr;gap:22px}.columns>section{min-width:0}pre{background:#13372e;color:#e0f2e7;overflow:auto;max-height:430px;border-radius:9px;padding:16px;font:14px/1.6 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.scroll{overflow:auto;max-height:440px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:11px;text-align:left;border-bottom:1px solid #dde6dc;white-space:nowrap}th{background:#edf5ee;position:sticky;top:0}code{overflow-wrap:anywhere}.pill{display:inline-block;background:#dff0e6;color:#205c42;border-radius:20px;padding:6px 12px;font-size:13px}footer{margin:20px 0;font-size:14px}a{color:#1d6750}@media(max-width:700px){main{padding:16px}h1{font-size:27px}.columns{grid-template-columns:1fr}article{padding:16px}td,th{padding:9px}pre{font-size:14px;max-height:320px}.pipeline{gap:6px}.pipeline span{padding:6px 9px;font-size:14px}}
</style><main><header><small>KNOWLEDGE ENGINEER · SQL EVIDENCE</small><h1 id="heading"></h1><p class="note" id="note"></p></header><label for="query" id="select-label"></label><select id="query"></select><div class="pipeline" id="pipeline"></div><article id="card"><span class="pill" id="engine"></span><h2 id="title"></h2><p id="logic"></p><p><strong id="params-label"></strong> <code id="params"></code></p><div class="columns"><section><h3 id="code-label"></h3><pre><code id="code"></code></pre><p><strong id="source-label"></strong> <code id="source"></code></p></section><section><h3 id="result-label"></h3><p id="count"></p><div class="scroll"><table id="result"></table></div><p id="output"></p></section></div></article><footer id="footer"></footer></main><script>
const panels=__DATA__;const lang=document.documentElement.lang,es=lang==='es';const t=(en,sp)=>es?sp:en;const set=(id,text)=>document.getElementById(id).textContent=text;
set('heading',t('From a business question to a checked result','De la pregunta de negocio al resultado comprobado'));set('note',t('Saved documentary view generated from actual SQLite results on synthetic data. Selection changes the displayed snapshot; it does not run SQL. This is not Power BI or Tableau.','Vista documental guardada, generada con resultados SQLite reales sobre datos sintéticos. La selección cambia la instantánea mostrada; no ejecuta SQL. No es Power BI ni Tableau.'));set('select-label',t('Choose an explained query','Elige una consulta explicada'));set('engine','SQLite · '+panels[0].row_count+' '+t('demo result rows','filas del resultado de la demo'));
for(const text of [t('Question','Pregunta'),t('Source → SQL','Fuente → SQL'),t('Actual rows','Filas reales'),t('Saved evidence','Evidencia guardada')]){const span=document.createElement('span');span.textContent=text;document.getElementById('pipeline').append(span);}
const select=document.getElementById('query');for(const p of panels){const option=document.createElement('option');option.value=p.id;option.textContent=p[lang];select.append(option);}
function render(){const p=panels.find(p=>p.id===select.value);set('engine','SQLite · '+t('executed locally','ejecutado localmente'));set('title',p[lang]);set('logic',p['logic_'+lang]);set('params-label',t('Bound parameters:','Parámetros vinculados:'));set('params',JSON.stringify(p.parameters));set('code-label',t('1 · The exact SQL','1 · El SQL exacto'));set('code',p.code);set('source-label',t('Source:','Fuente:'));set('source',p.file);set('result-label',t('2 · Actual result','2 · Resultado real'));set('count',p.row_count+' '+t('rows; showing up to 5. Amounts in integer cents; NULL is not zero.','filas; se muestran hasta 5. Importes en céntimos enteros; NULL no es cero.'));const table=document.getElementById('result');table.replaceChildren();if(p.rows.length){const head=document.createElement('tr');Object.keys(p.rows[0]).forEach(k=>{const th=document.createElement('th');th.textContent=k;head.append(th);});table.append(head);for(const row of p.rows.slice(0,5)){const tr=document.createElement('tr');Object.values(row).forEach(v=>{const td=document.createElement('td');td.textContent=v===null?'NULL':typeof v==='number'&&!Number.isInteger(v)?v.toFixed(4):String(v);tr.append(td);});table.append(tr);}}set('output',t('Full unrounded saved output: ','Salida completa sin redondear: ')+p.output);set('footer',t('Reproduce with: ','Reproducir con: ')+'python 05-validation/06-sql/build_guide.py · '+t('Core checks: verify.py · Native cloud and BI execution are not claimed.','Comprobaciones: verify.py · No se afirma ejecución nativa cloud ni BI.'));}
select.onchange=render;render();
</script></html>
