const panels=[{"id": "demo", "file": "../../03-pipelines/01-impact/glove-case.ts", "en": "The exact 180-line public demo query", "es": "La consulta exacta de las 180 líneas de la demo", "logic_en": "The exact exported SQL is run with a mapping view projecting the same six reviewed decisions. The six SKU filter prevents unrelated changes entering this result.", "logic_es": "Se ejecuta el SQL exportado del código de la demo con una vista que refleja las mismas seis decisiones. El filtro de seis SKU excluye los otros cambios.", "code": "-- Scope: the six glove SKUs in the guided case, not the full dataset.\nSELECT CASE WHEN m.status='valid' THEN m.target ELSE m.status END AS category,\n       COUNT(*) AS purchase_lines,\n       SUM(p.amount_cents) AS amount_cents\nFROM purchase p JOIN mapping m ON p.mapping_id=m.id\nWHERE m.id IN ('M0145', 'M0146', 'M0147', 'M0148', 'M0149', 'M0150')\nGROUP BY category ORDER BY category;", "execution": "Actual SQLite execution of the exported public-demo SQL; schema adapter is documented in build_guide.py", "parameters": {}, "query_sha256": "aecaeef238725804afae9ea735e8cc304b85dc2426fcf2a99b4de73f91554c1d", "row_count": 2, "rows": [{"category": "LatexGlove", "purchase_lines": 90, "amount_cents": 386802}, {"category": "NitrileGlove", "purchase_lines": 90, "amount_cents": 366045}], "output": "guided-case.output.json"}, {"id": "q01", "file": "01-basic/01-filter.sql", "en": "Inspect a product", "es": "Inspeccionar un producto", "logic_en": "WHERE selects one product and department; parameters are bound, not concatenated; ORDER BY makes LIMIT stable.", "logic_es": "WHERE elige producto y departamento; los parámetros se vinculan, no se concatenan; ORDER BY hace estable LIMIT.", "code": "-- Business question: inspect glove lines reported by the Research department.\nSELECT p.id, p.month, p.quantity, p.amount_cents\nFROM purchase AS p\nWHERE p.department = :department\n  AND p.mapping_id = :mapping_id\nORDER BY p.month, p.id\nLIMIT :row_limit;\n", "output": "01-basic/01-filter.output.json", "execution": "Actual local SQLite execution on synthetic project fixtures", "sqlite_version": "3.53.1", "parameters": {"department": "Research", "mapping_id": "M0001", "row_limit": 100}, "query_sha256": "e202c68b72ee40b83b319b564b398163f31bde4d1637283c9bf74e683c5f28ac", "row_count": 10, "rows": [{"id": "P00001", "month": "2026-01", "quantity": 1, "amount_cents": 150}, {"id": "P00007", "month": "2026-01", "quantity": 7, "amount_cents": 1050}, {"id": "P00013", "month": "2026-01", "quantity": 6, "amount_cents": 900}, {"id": "P00019", "month": "2026-01", "quantity": 5, "amount_cents": 750}, {"id": "P00025", "month": "2026-01", "quantity": 4, "amount_cents": 600}, {"id": "P00004", "month": "2026-04", "quantity": 4, "amount_cents": 600}, {"id": "P00010", "month": "2026-04", "quantity": 3, "amount_cents": 450}, {"id": "P00016", "month": "2026-04", "quantity": 2, "amount_cents": 300}, {"id": "P00022", "month": "2026-04", "quantity": 1, "amount_cents": 150}, {"id": "P00028", "month": "2026-04", "quantity": 7, "amount_cents": 1050}]}, {"id": "q02", "file": "02-intermediate/01-supplier-spend.sql", "en": "Reconcile supplier spend", "es": "Cuadrar gasto por proveedor", "logic_en": "Join each purchase to exactly one product, then one supplier. GROUP BY reduces rows only after the joins; HAVING filters the aggregate.", "logic_es": "Cada compra se une a un producto y después a un proveedor. GROUP BY agrega después de los joins; HAVING filtra el agregado.", "code": "-- Many purchase rows -> one mapping -> one supplier. No amount is duplicated.\nSELECT s.id AS supplier_id, s.name,\n       COUNT(*) AS purchase_lines, SUM(p.amount_cents) AS amount_cents\nFROM purchase AS p\nJOIN product_mapping AS m ON m.id = p.mapping_id\nJOIN supplier AS s ON s.id = m.supplier_id\nGROUP BY s.id, s.name\nHAVING SUM(p.amount_cents) > :minimum_cents\nORDER BY amount_cents DESC, s.id;\n", "output": "02-intermediate/01-supplier-spend.output.json", "execution": "Actual local SQLite execution on synthetic project fixtures", "sqlite_version": "3.53.1", "parameters": {"minimum_cents": 0}, "query_sha256": "e05c97ee7a563a3ddc671e67b77f6fc97de2574573e4f6cf95a6a893fd56e590", "row_count": 3, "rows": [{"supplier_id": "S3", "name": "Cobalt Science", "purchase_lines": 2880, "amount_cents": 12095664}, {"supplier_id": "S2", "name": "Boreal Supply", "purchase_lines": 2880, "amount_cents": 11839536}, {"supplier_id": "S1", "name": "Atlas Lab", "purchase_lines": 2880, "amount_cents": 11583408}]}, {"id": "q03", "file": "02-intermediate/02-review-queue.sql", "en": "Find broken classifications", "es": "Localizar clasificaciones rotas", "logic_en": "NOT EXISTS checks whether the target is active in v2. Only then aggregate dependent purchases. No inactive target is silently replaced.", "logic_es": "NOT EXISTS comprueba si el destino sigue activo en v2. Después se agregan sus compras; no se sustituye automáticamente un destino retirado.", "code": "-- Anti-semi join: only mappings whose target is absent or retired in the new release.\nSELECT m.id, m.supplier_id, m.target,\n       COUNT(p.id) AS affected_lines, SUM(p.amount_cents) AS affected_cents\nFROM product_mapping AS m\nJOIN purchase AS p ON p.mapping_id = m.id\nWHERE NOT EXISTS (\n SELECT 1 FROM concept AS c\n WHERE c.version = :release AND c.id = m.target AND c.deprecated = 0\n)\nGROUP BY m.id, m.supplier_id, m.target\nORDER BY affected_cents DESC, m.id;\n", "output": "02-intermediate/02-review-queue.output.json", "execution": "Actual local SQLite execution on synthetic project fixtures", "sqlite_version": "3.53.1", "parameters": {"release": "scenario-v2"}, "query_sha256": "229941fafe18a6cb502db0200afbc855ef4b4aea79babbb6d752e0ebd63569f3", "row_count": 30, "rows": [{"id": "M0228", "supplier_id": "S3", "target": "MercuryThermometer", "affected_lines": 30, "affected_cents": 187902}, {"id": "M0226", "supplier_id": "S2", "target": "MercuryThermometer", "affected_lines": 30, "affected_cents 2", "target": "ProtectiveGlove", "affected_lines": 30, "affected_cents": 128934}, {"id": "M0146", "supplier_id": "S1", "target": "ProtectiveGlove", "affected_lines": 30, "affected_cents": 126243}, {"id": "M0149", "supplier_id": "S3", "target": "ProtectiveGlove", "affected_lines": 30, "affected_cents": 124660}, {"id": "M0147", "supplier_id": "S2", "target": "ProtectiveGlove", "affected_lines": 30, "affected_cents": 122015}, {"id": "M0145", "supplier_id": "S1", "target": "ProtectiveGlove", "affected_lines": 30, "affected_cents": 119370}, {"id": "M0030", "supplier_id": "S3", "target": "Acetone", "affected_lines": 30, "affected_cents": 45045}, {"id": "M0028", "supplier_id": "S2", "target": "Acetone", "affected_lines": 30, "affected_cents": 42354}, {"id": "M0026", "supplier_id": "S1", "target": "Acetone", "affected_lines": 30, "affected_cents": 39663}, {"id": "M0029", "supplier_id": "S3", "target": "Acetone", "affected_lines": 30, "affected_cents": 39560}, {"id": "M0027", "supplier_id": "S2", "target": "Acetone", "affected_lines": 30, "affected_cents": 36915}, {"id": "M0025", "supplier_id": "S1", "target": "Acetone", "affected_lines": 30, "affected_cents": 34270}]}, {"id": "q04", "file": "03-advanced/01-monthly-windows.sql", "en": "Compare calendar months", "es": "Comparar meses de calendario", "logic_en": "monthly aggregates at supplier/month grain; filled adds missing months; LAG reads the previous calendar month; SUM OVER accumulates with explicit ROWS; zero denominators return NULL.", "logic_es": "monthly agrega proveedor/mes; filled completa meses vacíos; LAG lee el mes anterior de calendario; SUM OVER acumula con ROWS explícito; el denominador cero produce NULL.", "code": "-- Zero-filled supplier/month matrix makes LAG mean previous calendar month.\nWITH monthly AS (\n SELECT m.supplier_id, p.month, SUM(p.amount_cents) AS amount_cents\n FROM purchase AS p JOIN product_mapping AS m ON m.id = p.mapping_id\n GROUP BY m.supplier_id, p.month\n), filled AS (\n SELECT s.id AS supplier_id, d.month, COALESCE(m.amount_cents,0) AS amount_cents\n FROM supplier AS s CROSS JOIN dim_month AS d\n LEFT JOIN monthly AS m ON m.supplier_id = s.id AND m.month = d.month\n), windowed AS (\n SELECT supplier_id, month, amount_cents,\n        LAG(amount_cents) OVER(PARTITION BY supplier_id ORDER BY month) AS previous_cents,\n        SUM(amount_cents) OVER(PARTITION BY supplier_id ORDER BY month\n                              ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS running_cents\n FROM filled\n)\nSELECT supplier_id, month, amount_cents, previous_cents,\n       amount_cents - previous_cents AS delta_cents,\n       CASE WHEN previous_cents IS NULL OR previous_cents=0 THEN NULL\n            ELSE 100.0 * (amount_cents-previous_cents)/previous_cents END AS growth_pct,\n       running_cents\nFROM windowed ORDER BY supplier_id, month;\n", "output": "03-advanced/01-monthly-windows.output.json", "execution": "Actual local SQLite execution on synthetic project fixtures", "sqlite_version": "3.53.1", "parameters": {}, "query_sha256": "68389484f506a50b56e05d64c4ecdb7ab8ed646974483308c1b40481e0800b93", "row_count": 18, "rows": [{"supplier_id": "S1", "month": "2026-01", "amount_cents": 2194512, "previous_cents": null, "delta_cents": null, "growth_pct": null, "running_cents": 2194512}, {"supplier_id": "S1", "month": "2026-02", "amount_cents": 1994832, "previous_cents": 2194512, "delta_cents": -199680, "growth_pct": -9.099061659266388, "running_cents": 4189344}, {"supplier_id": "S1", "month": "2026-03", "amount_cents": 1795152, "previous_cents": 1994832, "delta_cents": -199680, "growth_pct": -10.009865492432445, "running_cents": 5984496}, {"supplier_id": "S1", "month": "2026-04", "amount_cents": 1595472, "previous_cents": 1795152, "delta_cents": -199680, "growth_pct": -11.123292066632798, "running_cents": 7579968}, {"supplier_id": "S1", "month": "2026-05", "amount_cents": 1752120, "previous_cents": 1595472, "delta_cents": 156648, "growth_pct": 9.8182857486 , "amount_cents": 1829400, "previous_cents": 1666128, "delta_cents": 163272, "growth_pct": 9.799487194261186, "running_cents": 9744984}, {"supplier_id": "S3", "month": "2026-06", "amount_cents": 2350680, "previous_cents": 1829400, "delta_cents": 521280, "growth_pct": 28.494588389635947, "running_cents": 12095664}]}, {"id": "q05", "file": "03-advanced/02-prioritize-impact.sql", "en": "Prioritize review work", "es": "Priorizar el trabajo de revisión", "logic_en": "inactive identifies broken mappings; exposure aggregates their cents; DENSE_RANK preserves exposure ties; ROW_NUMBER orders each supplier queue with an ID tie-break.", "logic_es": "inactive identifica correspondencias rotas; exposure suma sus céntimos; DENSE_RANK conserva empates; ROW_NUMBER ordena cada cola por proveedor con desempate por identificador.", "code": "-- CTEs isolate release drift, aggregate at mapping grain, then rank by financial exposure.\nWITH inactive AS (\n SELECT m.id,m.supplier_id,m.target\n FROM product_mapping AS m\n LEFT JOIN concept AS c ON c.version=:release AND c.id=m.target\n WHERE c.id IS NULL OR c.deprecated=1\n), exposure AS (\n SELECT i.id,i.supplier_id,i.target,COUNT(*) AS affected_lines,\n        SUM(p.amount_cents) AS affected_cents\n FROM inactive AS i JOIN purchase AS p ON p.mapping_id=i.id\n GROUP BY i.id,i.supplier_id,i.target\n)\nSELECT *,\n DENSE_RANK() OVER(ORDER BY affected_cents DESC) AS global_priority,\n ROW_NUMBER() OVER(PARTITION BY supplier_id ORDER BY affected_cents DESC,id) AS supplier_priority,\n 1.0 * affected_cents / NULLIF(SUM(affected_cents) OVER(),0) AS exposure_share\nFROM exposure ORDER BY affected_cents DESC,id;\n", "output": "03-advanced/02-prioritize-impact.output.json", "execution": "Actual local SQLite execution on synthetic project fixtures", "sqlite_version": "3.53.1", "parameters": {"release": "scenario-v2"}, "query_sha256": "8c3e0da4b240d9f7de7d9cb408f233b175d869b2ca047eec7d8e07be1b6eedb8", "row_count": 30, "rows": [{"id": "M0228", "supplie 3-taxonomy-spend.sql", "en": "Follow taxonomy dependencies", "es": "Recorrer dependencias del catálogo", "logic_en": "The recursive CTE discovers unique child/ancestor pairs. EXISTS includes each purchase once even if the taxonomy has several paths.", "logic_es": "La CTE recursiva descubre pares hijo/ancestro únicos. EXISTS incluye cada compra una sola vez aunque existan varios caminos.", "code": "-- UNION deduplicates ancestor pairs; EXISTS avoids multiplying a purchase along multiple paths.\nWITH RECURSIVE ancestors(child,ancestor) AS (\n SELECT id,id FROM concept WHERE version=:release AND deprecated=0\n UNION\n SELECT a.child,b.parent FROM ancestors AS a\n JOIN broader AS b ON b.child=a.ancestor AND b.version=:release\n JOIN concept AS c ON c.id=b.parent AND c.version=:release AND c.deprecated=0\n)\nSELECT COUNT(*) AS purchase_lines, COALESCE(SUM(p.amount_cents),0) AS amount_cents\nFROM purchase AS p JOIN product_mapping AS m ON m.id=p.mapping_id\nWHERE EXISTS(SELECT 1 FROM ancestors AS a WHERE a.child=m.target AND a.ancestor=:category);\n", "output": "03-advanced/03-taxonomy-spend.output.json", "execution": "Actual local SQLite execution on synthetic project fixtures", "sqlite_version": "3.53.1", "parameters": {"release": "scenario-v1", "category": "Supplies"}, "query_sha256": "ec98b02c4d4a3a8988d90e86485f4fc317f51fdfb21eb1407c9d15a419797b81", "row_count": 1, "rows": [{"purchase_lines": 8640, "amount_cents": 35518608}]}, {"id": "q07", "file": "03-advanced/04-deduplicate-events.sql", "en": "Keep the latest decision", "es": "Conservar la última decisión", "logic_en": "ROW_NUMBER partitions events by mapping and orders timestamp DESC then event_id DESC. The second ordering makes equal timestamps deterministic.", "logic_es": "ROW_NUMBER separa eventos por correspondencia y ordena por fecha e identificador descendentes. El segundo criterio resuelve empates de forma determinista.", "code": "-- Latest event wins; event_id breaks timestamp ties deterministically.\n-- The event fixture is test-created, isolated from the frozen purchase records.\nWITH ranked AS (\n SELECT *,ROW_NUMBER() OVER(PARTITION BY mapping_id ORDER BY event_time DESC,event_id DESC) AS sequence\n FROM mapping_event\n)\nSELECT mapping_id,target,event_id FROM ranked WHERE sequence=1 ORDER BY mapping_id;\n", "output": "03-advanced/04-deduplicate-events.output.json", "execution": "Actual local SQLite execution on synthetic project fixtures", "sqlite_version": "3.53.1", "parameters": {}, "query_sha256": "233877076304f28cf83b585ca93af9e2f5d2aef17983b473c7eb3e94289d1aac", "row_count": 1, "rows": [{"mapping_id": "M0001", "target": "Latest", "event_id": 3}]}, {"id": "q08", "file": "03-advanced/05-review-transaction.sql", "en": "Apply one atomic review", "es": "Aplicar una revisión atómica", "logic_en": "SAVEPOINT opens a review batch. A parameterized upsert inserts or updates the decision; RELEASE commits this savepoint. Caller rollback is independently verified for a failing batch.", "logic_es": "SAVEPOINT abre el lote. El upsert vinculado inserta o actualiza la decisión; RELEASE cierra el savepoint. El verificador prueba aparte el rollback de un lote inválido.", "code": "-- One atomic review batch. Caller binds values and handles rollback on constraint failure.\nSAVEPOINT review_batch;\nINSERT INTO review_decision(mapping_id,version,target,actor,reason)\nVALUES(:mapping_id,:release,:target,:actor,:reason)\nON CONFLICT(mapping_id,version) DO UPDATE SET\n target=excluded.target,actor=excluded.actor,reason=excluded.reason;\nRELEASE review_batch;\n", "output": "03-advanced/05-review-transaction.output.json", "execution": "Actual local SQLite execution on synthetic project fixtures", "sqlite_version": "3.53.1", "parameters": {"mapping_id": "M0001", "release": "scenario-v2", "target": "Water", "actor": "example-reviewer", "reason": "Synthetic documentary example"}, "query_sha256": "02098ff3bdc2e670e9f757a9c16ab0e74eeeeb1ae58c52d7857100a0eedbe77f", "row_count": 1, "rows": [{"mapping_id": "M0001", "version": "scenario-v2", "target": "Water", "actor": "example-reviewer", "reason": "Synthetic documentary example"}]}];const lang=document.documentElement.lang,es=lang==='es';const t=(en,sp)=>es?sp:en;const set=(id,text)=>document.getElementById(id).textContent=text;
